spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Gateway Routes Configuration

# Route to User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Route to Order Service
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/order-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Route to Shipment Service
spring.cloud.gateway.server.webmvc.routes[2].id=shipment-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://shipment-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/shipment-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Route to Warehouse Service
spring.cloud.gateway.server.webmvc.routes[3].id=warehouse-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://warehouse-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/warehouse-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

# Route to Product Service
spring.cloud.gateway.server.webmvc.routes[4].id=product-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/product-service/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

# Route to Notification Service
spring.cloud.gateway.server.webmvc.routes[5].id=notification-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

# CORS is configured via CorsConfig.java (servlet CorsConfigurationSource bean)