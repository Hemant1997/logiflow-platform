spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.default-zone=http://localhost:8761/eureka/

# Gateway Routes Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route to User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user-service/**

# Route to Order Service
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/order-service/**

# Route to Shipment Service
spring.cloud.gateway.routes[2].id=shipment-service
spring.cloud.gateway.routes[2].uri=lb://shipment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/shipment-service/**

# Route to Warehouse Service
spring.cloud.gateway.routes[3].id=warehouse-service
spring.cloud.gateway.routes[3].uri=lb://warehouse-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/warehouse-service/**

# Route to Product Service
spring.cloud.gateway.routes[4].id=product-service
spring.cloud.gateway.routes[4].uri=lb://product-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/product-service/**

# Route to Notification Service
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/notification-service/**
